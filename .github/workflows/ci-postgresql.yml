name: CI PostgreSQL

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  test-python-postgresql:
    name: Test Python with PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI_IMAGE: ci-postgresql:${{ github.run_id }}-${{ github.run_attempt }}-test-python-postgresql
      CI_CONTAINER: ci-postgresql-${{ github.run_id }}-${{ github.run_attempt }}-test-python-postgresql
      CI_REPORTS: ci-postgresql-${{ github.run_id }}-${{ github.run_attempt }}-test-python-postgresql

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/$CI_REPORTS"

      - name: Build Docker image
        run: docker build --file .github/workflows/ci-postgresql/Dockerfile --tag "$CI_IMAGE" .

      - name: Start Docker container
        run: |
          docker run --detach --name "$CI_CONTAINER" \
            --mount "type=bind,source=$RUNNER_TEMP/$CI_REPORTS,target=/ci-reports" \
            --entrypoint /usr/bin/sleep "$CI_IMAGE" infinity

      - name: Start and verify PostgreSQL
        run: docker exec "$CI_CONTAINER" /bin/bash .github/workflows/ci-postgresql/run-tests.sh start

      - name: Prepare test database
        run: docker exec "$CI_CONTAINER" /bin/bash .github/workflows/ci-postgresql/run-tests.sh prepare

      - name: Run project tests
        run: docker exec "$CI_CONTAINER" /bin/bash .github/workflows/ci-postgresql/run-tests.sh tests

      - name: Stop PostgreSQL
        if: always()
        run: |
          container_id=$(docker ps --quiet --filter "name=^/${CI_CONTAINER}$")
          if [ -n "$container_id" ]; then
            docker exec "$CI_CONTAINER" /bin/bash .github/workflows/ci-postgresql/run-tests.sh stop
          fi

      - name: Collect Docker diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/$CI_REPORTS"
          container_id=$(docker ps --all --quiet --filter "name=^/${CI_CONTAINER}$")
          if [ -n "$container_id" ]; then
            docker logs "$CI_CONTAINER" > "$RUNNER_TEMP/$CI_REPORTS/container.log" 2>&1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-postgresql-reports-${{ github.run_id }}-${{ github.run_attempt }}-test-python-postgresql
          path: ${{ runner.temp }}/${{ env.CI_REPORTS }}
          retention-days: 7
          if-no-files-found: warn

      - name: Remove Docker container
        if: always()
        run: |
          container_id=$(docker ps --all --quiet --filter "name=^/${CI_CONTAINER}$")
          if [ -n "$container_id" ]; then
            docker rm --force "$CI_CONTAINER"
          fi
